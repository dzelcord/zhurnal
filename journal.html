<title>Журнал воскресной школы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: классный журнал на мягком градиентном фоне; журнал и панели из матового стекла, линии волосяные */
:root{
  --ink:#1d1d1f; --muted:#86868b; --faint:#b8b8bf;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.86); --glass-edge:rgba(255,255,255,.75);
  --rule:rgba(29,29,31,.07); --rule-strong:rgba(29,29,31,.14);
  --fill:rgba(29,29,31,.05); --fill-hover:rgba(29,29,31,.09);
  --accent:#1d1d1f; --accent-ink:#ffffff;
  --plus:#1d1d1f; --minus:#a1a1a8; --danger:#c4473a;
  --bg-a:#eef1fb; --bg-b:#f7eef3; --bg-c:#ecf5f1;
  --shadow:0 1px 1px rgba(29,29,31,.03),0 12px 40px -12px rgba(60,70,110,.18);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PT Sans",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PT Sans",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg-a)}
body{min-height:100vh;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(60vw 50vh at 8% 0%,rgba(173,190,255,.45),transparent 70%),
    radial-gradient(55vw 55vh at 100% 15%,rgba(255,196,221,.40),transparent 70%),
    radial-gradient(70vw 60vh at 50% 110%,rgba(183,232,212,.45),transparent 70%),
    linear-gradient(160deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c));
  background-attachment:fixed;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.35rem;font-weight:600} h2{font-size:1.15rem;font-weight:600}
.muted{color:var(--muted)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid rgba(29,29,31,.35);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);
  border:1px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.8)}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.status{font-size:.82rem;padding:6px 12px;border-radius:999px;white-space:nowrap;color:var(--muted);
  background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glass-edge)}
.status.ok{color:var(--ink)} .status.err{color:var(--danger)}
.hint{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;color:var(--muted);padding-inline:4px}
.hint b.p{color:var(--plus)} .hint b.m{color:var(--minus)}
.banner{padding:10px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-edge);font-size:.9rem}

/* журнал */
.book{border-radius:22px;overflow:auto;max-height:78vh;background:var(--glass);
  -webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);
  border:1px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.8)}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%}
th,td{border-bottom:1px solid var(--rule);padding:0;background:transparent}
td+td,th+th{border-left:1px solid var(--rule)}
thead th{position:sticky;top:0;z-index:2;background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--rule-strong);vertical-align:bottom;font-weight:400}
th.corner,td.name,td.num{position:sticky;z-index:1;background:var(--glass-strong)}
td.num{left:0} td.name{left:40px;border-right:1px solid var(--rule-strong)}
th.corner{left:0;z-index:3;text-align:left;padding:14px 16px;min-width:270px;max-width:320px;vertical-align:top;border-right:1px solid var(--rule-strong)}
.lbl{display:block;margin-bottom:4px;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
th.corner .grp{font-family:var(--display);font-size:1.2rem;font-weight:600;display:block;margin-top:2px;overflow-wrap:anywhere}
.gnav{display:flex;align-items:center;gap:6px;margin-top:6px}
.gnav .grp{flex:1;min-width:0;margin:0!important;text-align:center}
.garrow{width:34px;height:34px;border-radius:999px;border:0;background:var(--fill);font-size:1.1rem;line-height:1;color:var(--ink)}
.garrow:hover{background:var(--fill-hover)}
td.num{width:40px;min-width:40px;text-align:center;color:var(--faint);font-size:.8rem}
td.name{padding:6px 8px 6px 12px;min-width:230px;max-width:280px}
.namebox{display:flex;align-items:center;gap:6px}
.namebox span{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.pen{width:30px;height:30px;border:0;border-radius:999px;background:transparent;color:var(--faint);font-size:.9rem;opacity:0}
tr:hover .pen,.pen:focus-visible{opacity:1}
.pen:hover{background:var(--fill);color:var(--ink)}
.datecell{min-width:72px;padding:10px 6px;text-align:center}
.datecell b{display:block;font-size:1.05rem;font-weight:600}
.datecell small{display:block;color:var(--muted);font-size:.72rem}
.lock{margin-top:2px;border:0;background:transparent;color:var(--faint);font-size:.72rem;min-height:24px;padding:2px 6px;border-radius:999px}
.lock:hover{background:var(--fill);color:var(--ink)}
.newdate{min-width:170px;padding:10px;vertical-align:bottom}
.newdate input,.editdate input{width:100%;min-height:36px;padding:4px 10px;border:0;border-radius:10px;background:var(--fill);font-size:.88rem}
.small{min-height:34px;padding:4px 12px;border-radius:999px;border:0;background:var(--fill);font-weight:500;font-size:.82rem;margin-top:6px;width:100%}
.small:hover{background:var(--fill-hover)}
.small.go{background:var(--accent);color:var(--accent-ink)}
.small.danger{color:var(--danger)}
.err{color:var(--danger);font-size:.75rem;margin-top:4px;white-space:normal}
td.cell{text-align:center}
.mark{width:100%;min-width:72px;height:46px;border:0;background:transparent;font-size:1.3rem;font-weight:500;line-height:1;border-radius:0}
.mark.p{color:var(--plus)}
.mark.m{color:var(--minus)}
.mark:hover{background:rgba(255,255,255,.6)}
.mark:disabled{cursor:default}
td.blank{background:rgba(255,255,255,.25)}
th.notes,td.notes{min-width:260px}
th.notes{text-align:left;padding:10px 14px}
td.notes textarea{display:block;width:100%;min-height:46px;border:0;padding:12px 14px;background:transparent;resize:vertical;font-size:.88rem;line-height:1.35;color:var(--ink)}
td.notes textarea::placeholder{color:var(--faint)}
td.notes textarea:focus{outline:none;background:rgba(255,255,255,.6)}
tfoot td{font-weight:500;text-align:center;padding:10px 6px;border-bottom:0;color:var(--muted);font-size:.88rem}
tfoot td.name{text-align:left}
.addkid{display:flex;gap:6px}
.addkid input{flex:1;min-width:0;min-height:36px;padding:4px 12px;border:0;border-radius:999px;background:var(--fill);font-size:.9rem}
.addkid input::placeholder{color:var(--muted)}
.addkid button{min-height:36px;padding:4px 14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:500;font-size:.88rem}
.editrow{display:flex;flex-direction:column;gap:6px}
.editrow input{min-height:36px;padding:4px 12px;border:0;border-radius:10px;background:#fff;box-shadow:0 0 0 1px var(--rule-strong)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns .small{width:auto;margin:0}
.panel{border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:14px;background:var(--glass);
  -webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);
  border:1px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.8)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.field input{min-height:42px;padding:6px 14px;border:0;border-radius:12px;background:var(--fill)}
.inline{display:flex;flex-wrap:wrap;gap:8px}
.inline input{flex:1 1 220px;min-width:0}
.big{min-height:42px;padding:6px 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:500}
.ghost{min-height:42px;padding:6px 18px;border-radius:999px;border:0;background:var(--fill);font-weight:500}
.ghost:hover{background:var(--fill-hover)}
.list{display:flex;flex-direction:column;gap:6px}
.list .it{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.list .it span{flex:1}
details.more{padding-block:12px}
details.more summary{cursor:pointer;font-weight:500;color:var(--muted);min-height:32px;display:flex;align-items:center;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"›";display:inline-block;margin-right:8px;transition:transform .15s}
details.more[open] summary::before{transform:rotate(90deg)}
.empty{text-align:center;padding:36px 12px}
@media (prefers-reduced-motion:no-preference){.mark,.small,.ghost,.garrow,.pen{transition:background .15s,opacity .15s}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Журнал воскресной школы</h1>
    <div id="status" class="status busy">Загружаю…</div>
  </header>
  <main id="main" style="display:flex;flex-direction:column;gap:16px">
    <div class="panel empty"><h2>Открываю журнал…</h2><p class="muted">Это займёт несколько секунд.</p></div>
  </main>
</div>

<script>
(function(){
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const WD=["вс","пн","вт","ср","чт","пт","сб"];
function nearestSunday(){const d=new Date();const w=d.getDay();d.setDate(d.getDate()+(w<=3?-w:7-w));return iso(d)}
const short=s=>{const d=parse(s);return d.getDate()+"."+pad(d.getMonth()+1)};
const store={get(k){try{return localStorage.getItem("zh-"+k)}catch(e){return null}},set(k,v){try{localStorage.setItem("zh-"+k,v)}catch(e){}}};

const S={db:null,canWrite:true,canKnown:false,classes:[],students:[],cols:[],ready:{c:false,s:false,d:false},failed:false,slow:false,
  classId:store.get("cls"),working:{},saving:{},dirty:{},timers:{},error:false,ask:null,editKid:null,editCol:null,msg:{},
  pendingRender:false,scrolledFor:null};
const main=document.getElementById("main"),statusEl=document.getElementById("status");
const ready=()=>S.ready.c&&S.ready.s&&S.ready.d;
const dis=()=>S.canWrite?"":" disabled";

function setStatus(){
  let t,c;
  if(S.failed){t="Нет связи с журналом";c="err"}
  else if(!ready()){t=S.slow?"Связь медленная, жду…":"Загружаю…";c="busy"}
  else if(S.error){t="Не сохранилось. Проверьте интернет";c="err"}
  else if(Object.keys(S.timers).length||Object.values(S.saving).some(Boolean)){t="Сохраняю…";c="busy"}
  else if(!S.canWrite){t="Только просмотр";c="busy"}
  else{t="✓ Всё сохранено";c="ok"}
  statusEl.textContent=t;statusEl.className="status "+c;
}
const cls=()=>S.classes.find(c=>c.id===S.classId);
const kids=(all)=>S.students.filter(s=>s.classId===S.classId&&(all||s.active!==false)).sort((a,b)=>a.name.localeCompare(b.name,"ru"));
const cols=()=>S.cols.filter(c=>c.classId===S.classId).map(c=>S.working["d/"+c.id]?Object.assign({},c,S.working["d/"+c.id]):c)
  .sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));

/* очередь записи: один документ пишется по одному разу за раз */
function queue(path,patch,delay){
  S.working[path]=Object.assign({},S.working[path]||{},patch);
  clearTimeout(S.timers[path]);
  S.timers[path]=setTimeout(()=>{delete S.timers[path];flush(path)},delay);
  setStatus();
}
async function flush(path){
  if(S.saving[path]){S.dirty[path]=true;return}
  const body=S.working[path];if(!body)return;
  S.saving[path]=true;setStatus();
  const [kind,id]=path.split("/");
  const coll=kind==="d"?"dates":"students";
  try{await S.db.doc(coll+"/"+id).update(body);S.error=false;
    if(S.working[path]===body&&!S.timers[path])delete S.working[path];}
  catch(e){S.error=true;if(e&&e.code==="invalid_argument"&&!S.canKnown){S.canWrite=false;render(true)}}
  S.saving[path]=false;
  if(S.dirty[path]){S.dirty[path]=false;flush(path);return}
  setStatus();
}
async function safe(p){try{const r=await p;S.error=false;setStatus();return r}catch(e){S.error=true;setStatus();return null}}

/* ---------- отрисовка ---------- */
function step(d){const n=S.classes.length;if(n<2)return;const i=S.classes.findIndex(c=>c.id===S.classId);
  S.classId=S.classes[(i+d+n)%n].id;store.set("cls",S.classId);S.ask=S.editKid=S.editCol=null;S.msg={};render(true)}
window.__groupStep=step;
window.__flushAll=async()=>{for(const p of Object.keys(S.timers)){clearTimeout(S.timers[p]);delete S.timers[p];await flush(p)}};
function groupBar(){
  return "";
  return `<div class="chips"><span class="muted">Группа:</span>${S.classes.map(c=>
    `<button class="chip" data-act="cls" data-id="${esc(c.id)}" aria-pressed="${c.id===S.classId}">${esc(c.name)}</button>`).join("")}</div>`;
}
function dateHead(c){
  const id=esc(c.id);
  if(S.editCol===c.id){
    const delAsk=S.ask==="del:"+c.id;
    return `<th class="datecell editdate"><input type="date" id="ed-${id}" value="${esc(c.date)}" aria-label="Дата">
      <button class="small go" data-act="savecol" data-id="${id}">Закрепить</button>
      ${delAsk?`<div class="err">Удалить столбец со всеми отметками?</div><button class="small danger" data-act="delcol" data-id="${id}">Да, удалить</button><button class="small" data-act="cancel">Нет</button>`
        :`<button class="small danger" data-act="askdel" data-id="${id}">Удалить столбец</button>`}
      <button class="small" data-act="closecol">Отмена</button>${S.msg[c.id]?`<div class="err">${esc(S.msg[c.id])}</div>`:""}</th>`;
  }
  const d=parse(c.date);
  let h=`<th class="datecell" title="Дата закреплена"><b>${short(c.date)}</b><small>${WD[d.getDay()]} · ${d.getFullYear()}</small>`;
  if(S.canWrite){
    h+=S.ask==="unlock:"+c.id
      ?`<div class="err">Изменить дату?</div><button class="small" data-act="unlock" data-id="${id}">Да</button><button class="small" data-act="cancel">Нет</button>`
      :`<button class="lock" data-act="askunlock" data-id="${id}">изменить</button>`;
  }
  return h+`</th>`;
}
function journal(){
  const c=cls(),list=kids(),cs=cols();
  const used=new Set(cs.map(x=>x.date));
  let suggest=nearestSunday();while(used.has(suggest)){const d=parse(suggest);d.setDate(d.getDate()+7);suggest=iso(d)}
  let h=`<table><thead><tr><th class="corner" colspan="2">`;
  const gn=S.classes.length,gi=S.classes.findIndex(x=>x.id===S.classId);
  if(gn>1)h+=`<span class="lbl">Группа ${gi+1} из ${gn}</span><div class="gnav"><button class="garrow" data-act="gstep" data-d="-1" aria-label="Предыдущая группа" title="Предыдущая группа">‹</button><span class="grp">${esc(c.name)}</span><button class="garrow" data-act="gstep" data-d="1" aria-label="Следующая группа" title="Следующая группа">›</button></div></th>`;
  else h+=`<span class="lbl">Группа</span><span class="grp">${esc(c.name)}</span></th>`;
  h+=cs.map(dateHead).join("");
  if(S.canWrite)h+=`<th class="newdate"><span class="lbl">Новая дата</span>
    <input type="date" id="newdate" value="${suggest}" aria-label="Дата нового урока">
    <button class="small go" data-act="addcol">Закрепить дату</button>${S.msg.new?`<div class="err">${esc(S.msg.new)}</div>`:""}</th>`;
  h+=`<th class="notes"><span class="lbl">Заметки</span></th></tr></thead><tbody>`;
  list.forEach((k,i)=>{
    const kid=esc(k.id);
    let name;
    if(S.editKid===k.id){
      name=`<div class="editrow"><input id="ren-${kid}" value="${esc(k.name)}" aria-label="Имя и фамилия">
        <div class="btns"><button class="small go" data-act="rename" data-sid="${kid}">Сохранить</button>
        ${S.ask==="hide:"+k.id?`<button class="small danger" data-act="hide" data-sid="${kid}">Да, убрать</button><button class="small" data-act="cancel">Нет</button>`
          :`<button class="small danger" data-act="askhide" data-sid="${kid}">Убрать из журнала</button>`}
        <button class="small" data-act="closekid">Отмена</button></div></div>`;
    }else name=`<div class="namebox"><span>${esc(k.name)}</span>${S.canWrite?`<button class="pen" data-act="editkid" data-sid="${kid}" aria-label="Исправить имя">✎</button>`:""}</div>`;
    h+=`<tr><td class="num">${i+1}</td><td class="name">${name}</td>`;
    for(const col of cs){
      const v=(col.marks||{})[k.id]||"";
      h+=`<td class="cell"><button class="mark ${v==="+"?"p":v==="-"?"m":""}" data-act="mark" data-id="${esc(col.id)}" data-sid="${kid}" aria-label="${esc(k.name)}, ${short(col.date)}: ${v==="+"?"был":v==="-"?"не был":"пусто"}"${dis()}>${v==="+"?"+":v==="-"?"−":""}</button></td>`;
    }
    if(S.canWrite)h+=`<td class="blank"></td>`;
    h+=`<td class="notes"><textarea id="note-${kid}" data-live="note" data-sid="${kid}" rows="1" aria-label="Заметка: ${esc(k.name)}"${dis()}>${esc(k.note||"")}</textarea></td></tr>`;
  });
  if(S.canWrite)h+=`<tr class="addrow"><td class="num">${list.length+1}</td><td class="name"><div class="addkid">
    <input id="newkid" placeholder="Фамилия Имя" aria-label="Фамилия и имя нового ребёнка"><button data-act="addkid">Добавить</button></div></td>
    ${cs.map(()=>`<td></td>`).join("")}<td class="blank"></td><td class="notes"></td></tr>`;
  h+=`</tbody>`;
  if(list.length&&cs.length)h+=`<tfoot><tr><td class="num"></td><td class="name">Было на уроке</td>${cs.map(col=>
    `<td>${list.filter(k=>(col.marks||{})[k.id]==="+").length}</td>`).join("")}${S.canWrite?`<td class="blank"></td>`:""}<td class="notes"></td></tr></tfoot>`;
  h+=`</table>`;
  return h;
}
function view(){
  const c=cls();
  let h=groupBar();
  if(!S.canWrite)h+=`<div class="banner">У вас доступ только для просмотра. Чтобы заполнять журнал, попросите владельца дать вам права «Участник».</div>`;
  h+=`<div class="hint"><span>Нажмите на клетку: один раз <b class="p">+</b> (был), второй раз <b class="m">−</b> (не был), третий раз клетка очистится.</span>
    <span>Сохранять ничего не нужно.</span></div>`;
  h+=`<div class="book" id="book">${journal()}</div>`;
  const gone=kids(true).filter(k=>k.active===false);
  if(S.canWrite)h+=`<details class="more panel"><summary>Настройки группы</summary>
    <div class="field"><label for="clsname">Название группы</label><div class="inline"><input id="clsname" value="${esc(c.name)}"><button class="ghost" data-act="renamecls">Сохранить</button></div></div>
    <div class="field"><label for="newcls">Новая группа</label><div class="inline"><input id="newcls" placeholder="Например: Старшая группа"><button class="ghost" data-act="addcls">Создать</button></div></div>
    ${gone.length?`<div class="field"><label>Убранные из журнала</label><div class="list">${gone.map(k=>`<div class="it"><span>${esc(k.name)}</span><button class="ghost" data-act="unhide" data-sid="${esc(k.id)}">Вернуть</button></div>`).join("")}</div></div>`:""}
  </details>`;
  return h;
}
function render(){
  const ae=document.activeElement;
  const keep=ae&&ae.id&&ae.id!=="newdate"&&main.contains(ae)&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")
    ?{id:ae.id,v:ae.value,s:ae.selectionStart,e:ae.selectionEnd}:null;
  draw();
  if(keep){const el=document.getElementById(keep.id);
    if(el){el.value=keep.v;el.focus({preventScroll:true});try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}
function draw(){
  setStatus();
  if(S.failed){main.innerHTML=`<div class="panel empty"><h2>Журнал не открылся</h2><p>Записи журнала хранятся в Claude. Войдите в свой аккаунт Claude и откройте ссылку ещё раз.</p></div>`;return}
  if(!ready()){main.innerHTML=`<div class="panel empty"><h2>Открываю журнал…</h2><p class="muted">${S.slow?"Связь медленная. Подождите ещё немного.":"Это займёт несколько секунд."}</p></div>`;return}
  if(!S.classes.length){main.innerHTML=`<div class="panel"><h2>Начнём</h2><p>Как называется группа? Название будет стоять в левом верхнем углу журнала.</p>
    <div class="field"><label for="newcls">Название группы</label><div class="inline"><input id="newcls" placeholder="Например: Младшая группа"${dis()}><button class="big" data-act="addcls"${dis()}>Создать журнал</button></div></div></div>`;return}
  if(!cls()){S.classId=S.classes[0].id;store.set("cls",S.classId)}
  const old=document.getElementById("book");const sl=old?old.scrollLeft:0,st=old?old.scrollTop:0,sy=window.scrollY;
  const det=main.querySelector("details.more");const open=det&&det.open;
  main.innerHTML=view();
  const b=document.getElementById("book");
  if(S.scrolledFor!==S.classId){S.scrolledFor=S.classId;b.scrollLeft=b.scrollWidth}else{b.scrollLeft=sl;b.scrollTop=st}
  if(open)main.querySelector("details.more").open=true;
  window.scrollTo(0,sy);
}

/* ---------- действия ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t||t.disabled)return;
  const a=t.dataset.act,id=t.dataset.id,sid=t.dataset.sid;
  switch(a){
    case "gstep":step(Number(t.dataset.d));break;
    case "cls":S.classId=id;store.set("cls",id);S.ask=S.editKid=S.editCol=null;render(true);break;
    case "mark":{
      const col=cols().find(x=>x.id===id);if(!col)return;
      const marks=Object.assign({},col.marks||{});const v=marks[sid]||"";
      marks[sid]=v===""?"+":v==="+"?"-":"";
      queue("d/"+id,{marks},500);render(true);break}
    case "addcol":{
      const v=document.getElementById("newdate").value;S.msg={};
      if(!v){S.msg.new="Выберите дату.";render(true);return}
      if(cols().some(x=>x.date===v)){S.msg.new="Такая дата уже есть в журнале.";render(true);return}
      await safe(S.db.collection("dates").add({classId:S.classId,date:v,marks:{},createdAt:Date.now()}));
      const b=document.getElementById("book");if(b)setTimeout(()=>{b.scrollLeft=b.scrollWidth},50);break}
    case "askunlock":S.ask="unlock:"+id;render(true);break;
    case "unlock":S.ask=null;S.editCol=id;S.msg={};render(true);break;
    case "closecol":S.editCol=null;S.ask=null;S.msg={};render(true);break;
    case "savecol":{
      const v=document.getElementById("ed-"+id).value;S.msg={};
      if(!v){S.msg[id]="Выберите дату.";render(true);return}
      if(cols().some(x=>x.date===v&&x.id!==id)){S.msg[id]="Такая дата уже есть.";render(true);return}
      S.editCol=null;queue("d/"+id,{date:v},0);render(true);break}
    case "askdel":S.ask="del:"+id;render(true);break;
    case "delcol":S.ask=null;S.editCol=null;await safe(S.db.doc("dates/"+id).delete());break;
    case "cancel":S.ask=null;render(true);break;
    case "editkid":S.editKid=sid;S.ask=null;render(true);{const i=document.getElementById("ren-"+sid);i&&i.focus()}break;
    case "closekid":S.editKid=null;S.ask=null;render(true);break;
    case "rename":{const v=document.getElementById("ren-"+sid).value.trim();if(!v)return;S.editKid=null;queue("s/"+sid,{name:v},0);render(true);break}
    case "askhide":S.ask="hide:"+sid;render(true);break;
    case "hide":S.ask=null;S.editKid=null;queue("s/"+sid,{active:false},0);render(true);break;
    case "unhide":queue("s/"+sid,{active:true},0);break;
    case "addkid":{const i=document.getElementById("newkid");const v=i.value.trim();if(!v){i.focus();return}
      i.value="";await safe(S.db.collection("students").add({name:v,classId:S.classId,note:"",active:true,createdAt:Date.now()}));
      const n=document.getElementById("newkid");n&&n.focus();break}
    case "renamecls":{const v=document.getElementById("clsname").value.trim();if(v)await safe(S.db.doc("classes/"+S.classId).update({name:v}));break}
    case "addcls":{const i=document.getElementById("newcls");const v=i.value.trim();if(!v){i.focus();return}
      const ref=S.db.collection("classes").doc();S.classId=ref.id;store.set("cls",ref.id);
      await safe(ref.set({name:v,createdAt:Date.now()}));render(true);break}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.live==="note")queue("s/"+t.dataset.sid,{note:t.value},800);
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const map={newkid:"addkid",newcls:"addcls",clsname:"renamecls"};
  if(map[e.target.id]){e.preventDefault();const b=document.querySelector(`[data-act="${map[e.target.id]}"]`);b&&b.click()}
  if(e.target.id&&e.target.id.startsWith("ren-")){e.preventDefault();document.querySelector(`[data-act="rename"]`).click()}
});

/* ---------- старт ---------- */
(async()=>{
  const slow=setTimeout(()=>{S.slow=true;render()},10000);
  const db=window.localDB||(typeof claude!=="undefined"?await claude.use("db"):null);
  if(!db){clearTimeout(slow);S.failed=true;render(true);return}
  S.db=db;
  if(!window.localDB&&typeof claude!=="undefined")claude.use("user").then(async u=>{if(!u)return;try{const c=await u.can("data.write");if(c===false){S.canWrite=false;S.canKnown=true;render(true)}else if(c===true)S.canKnown=true}catch(e){}});
  const done=()=>{if(ready())clearTimeout(slow);render()};
  const fail=()=>{clearTimeout(slow);S.failed=true;render(true)};
  const all=s=>s.docs.map(d=>Object.assign({id:d.id},d.data()));
  db.collection("classes").onSnapshot(s=>{S.classes=all(s).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));if(!s.metadata.fromCache)S.ready.c=true;done()},fail);
  db.collection("students").onSnapshot(s=>{S.students=all(s);if(!s.metadata.fromCache)S.ready.s=true;done()},fail);
  db.collection("dates").onSnapshot(s=>{S.cols=all(s);if(!s.metadata.fromCache)S.ready.d=true;done()},fail);
})();
})();
</script>
